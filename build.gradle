plugins {
    id 'java'
    id 'application'
}

group 'com.hamzajg.examples'
version '1.0-SNAPSHOT'

sourceCompatibility = 12

repositories {
    mavenCentral()
}

dependencies {
    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
}

application {
    mainClass = 'com.hamzajg.examples.http.client.LinkValidatorSync'
}
